<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Girasol en el Espacio 🌻✨</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      overflow: hidden;
      background-color: #030308;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    .card-modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 215, 0, 0.4);
      padding: 30px 40px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 25px rgba(255, 215, 0, 0.2);
      text-align: center;
      display: none;
      z-index: 10;
      animation: popIn 0.4s ease-out;
    }
    .card-modal h2 {
      color: #ffd700;
      font-size: 2.2rem;
      margin-bottom: 15px;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }
    .close-btn {
      background: #ffd700;
      border: none;
      padding: 8px 20px;
      border-radius: 15px;
      font-weight: bold;
      color: #111;
      cursor: pointer;
      margin-top: 10px;
    }
    @keyframes popIn {
      from { opacity: 0; transform: translate(-50%, -40%) scale(0.8); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="card" class="card-modal">
    <h2>te amo</h2>
    <button class="close-btn" onclick="closeCard(event)">✨</button>
  </div>

  <script>
    let scene, camera, renderer, particles, sunflowerGroup;

    function createSunflower() {
      const group = new THREE.Group();

      // Centro del girasol
      const centerGeo = new THREE.CylinderGeometry(1.2, 1.2, 0.3, 32);
      const centerMat = new THREE.MeshBasicMaterial({ color: 0x4a2e00 });
      const center = new THREE.Mesh(centerGeo, centerMat);
      center.rotation.x = Math.PI / 2;
      group.add(center);

      // Pétalos amarillos
      const petalCount = 20;
      const petalMat = new THREE.MeshBasicMaterial({ color: 0xffd700, side: THREE.DoubleSide });

      for (let i = 0; i < petalCount; i++) {
        const angle = (i / petalCount) * Math.PI * 2;
        const petalGeo = new THREE.ConeGeometry(0.35, 1.8, 12);
        const petal = new THREE.Mesh(petalGeo, petalMat);

        petal.position.x = Math.cos(angle) * 1.8;
        petal.position.y = Math.sin(angle) * 1.8;
        petal.position.z = 0;

        petal.rotation.z = angle - Math.PI / 2;
        group.add(petal);
      }

      // Capa interna de pétalos pequeños
      for (let i = 0; i < petalCount; i++) {
        const angle = (i / petalCount) * Math.PI * 2 + (Math.PI / petalCount);
        const petalGeo = new THREE.ConeGeometry(0.3, 1.4, 12);
        const petal = new THREE.Mesh(petalGeo, petalMat);

        petal.position.x = Math.cos(angle) * 1.4;
        petal.position.y = Math.sin(angle) * 1.4;
        petal.position.z = 0.05;

        petal.rotation.z = angle - Math.PI / 2;
        group.add(petal);
      }

      // Tallo
      const stemGeo = new THREE.CylinderGeometry(0.12, 0.12, 4, 16);
      const stemMat = new THREE.MeshBasicMaterial({ color: 0x2e8b57 });
      const stem = new THREE.Mesh(stemGeo, stemMat);
      stem.position.y = -2.2;
      group.add(stem);

      // Hoja
      const leafGeo = new THREE.ConeGeometry(0.4, 1.2, 4);
      const leafMat = new THREE.MeshBasicMaterial({ color: 0x228b22, side: THREE.DoubleSide });
      const leaf = new THREE.Mesh(leafGeo, leafMat);
      leaf.scale.set(1, 0.1, 1.5);
      leaf.position.set(0.6, -2, 0);
      leaf.rotation.z = -Math.PI / 3;
      group.add(leaf);

      return group;
    }

    function init() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 8;

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      // Partículas espaciales
      const particleCount = 1500;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);

      for (let i = 0; i < particleCount * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 30;
        positions[i + 1] = (Math.random() - 0.5) * 30;
        positions[i + 2] = (Math.random() - 0.5) * 30;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

      const material = new THREE.PointsMaterial({
        size: 0.08,
        color: 0xffd700,
        transparent: true,
        opacity: 0.8
      });

      particles = new THREE.Points(geometry, material);
      scene.add(particles);

      // Girasol 3D
      sunflowerGroup = createSunflower();
      scene.add(sunflowerGroup);

      window.addEventListener('resize', onWindowResize);
      window.addEventListener('click', showCard);
      window.addEventListener('touchstart', showCard);

      animate();
    }

    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();

      // Animación de flotación suave y rotación
      if (sunflowerGroup) {
        sunflowerGroup.rotation.y = Math.sin(elapsedTime * 0.5) * 0.4;
        sunflowerGroup.rotation.x = Math.cos(elapsedTime * 0.3) * 0.2;
        sunflowerGroup.position.y = Math.sin(elapsedTime * 1.2) * 0.3;
      }

      particles.rotation.y += 0.0008;

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function showCard() {
      document.getElementById('card').style.display = 'block';
    }

    function closeCard(event) {
      event.stopPropagation();
      document.getElementById('card').style.display = 'none';
    }

    init();
  </script>
</body>
</html>

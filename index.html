<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sailor Moon 🌙✨</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      overflow: hidden;
      background: radial-gradient(circle at center, #2b1055 0%, #090a0f 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <script>
    let scene, camera, renderer, particles, moonMesh;

    // Tu imagen de Sailor Moon
    const URL_IMAGEN_SAILOR = 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ9I2HM6SeHbzCYqmuZ7wZBC7oORnqa_O4kBmD6UvU0ouWQk3WJ5nO16HQs&s=10'; 

    function init() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 7;

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      // Partículas flotantes rosas y doradas
      const particleCount = 1500;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);
      const colors = new Float32Array(particleCount * 3);

      const color1 = new THREE.Color(0xffb6c1);
      const color2 = new THREE.Color(0xffd700);

      for (let i = 0; i < particleCount * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 30;
        positions[i + 1] = (Math.random() - 0.5) * 30;
        positions[i + 2] = (Math.random() - 0.5) * 30;

        const mixedColor = Math.random() > 0.5 ? color1 : color2;
        colors[i] = mixedColor.r;
        colors[i + 1] = mixedColor.g;
        colors[i + 2] = mixedColor.b;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: 0.09,
        vertexColors: true,
        transparent: true,
        opacity: 0.85
      });

      particles = new THREE.Points(geometry, material);
      scene.add(particles);

      // Cargar la imagen de Sailor Moon en el espacio 3D
      const textureLoader = new THREE.TextureLoader();
      textureLoader.load(URL_IMAGEN_SAILOR, function(texture) {
        const planeGeo = new THREE.PlaneGeometry(3.8, 3.8);
        const planeMat = new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true,
          side: THREE.DoubleSide
        });
        moonMesh = new THREE.Mesh(planeGeo, planeMat);
        scene.add(moonMesh);
      });

      window.addEventListener('resize', onWindowResize);

      animate();
    }

    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();

      // Animación de flotación suave
      if (moonMesh) {
        moonMesh.position.y = Math.sin(elapsedTime * 1.2) * 0.25;
        moonMesh.rotation.y = Math.sin(elapsedTime * 0.5) * 0.15;
        moonMesh.rotation.z = Math.cos(elapsedTime * 0.4) * 0.05;
      }

      particles.rotation.y += 0.0008;

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    init();
  </script>
</body>
</html>

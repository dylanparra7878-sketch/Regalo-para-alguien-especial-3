<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Mi Princesa 🌻✨</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      color: #fff;
    }

    /* Fondo de estrellas flotantes */
    .bg-particles {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      overflow: hidden;
      z-index: 1;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 223, 0, 0.7);
      box-shadow: 0 0 10px rgba(255, 223, 0, 0.8);
      animation: float 6s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(0.8); opacity: 0.3; }
      50% { transform: translateY(-30px) scale(1.2); opacity: 1; }
    }

    /* Tarjeta Elegante */
    .card {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 215, 0, 0.3);
      padding: 40px 30px;
      border-radius: 24px;
      text-align: center;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                  0 0 30px rgba(255, 215, 0, 0.15);
      animation: fadeIn 1.5s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Girasol animado */
    .sunflower {
      font-size: 70px;
      display: inline-block;
      animation: pulse 3s infinite ease-in-out;
      margin-bottom: 15px;
      filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.6));
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.1) rotate(5deg); }
    }

    h1 {
      font-size: 1.8rem;
      color: #ffd700;
      margin-bottom: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
    }

    p {
      font-size: 1.25rem;
      line-height: 1.6;
      color: #f0f0f0;
      font-style: italic;
      font-weight: 300;
    }

    .sparkles {
      margin-top: 20px;
      font-size: 1.2rem;
      letter-spacing: 4px;
    }
  </style>
</head>
<body>

  <!-- Partículas de fondo -->
  <div class="bg-particles">
    <div class="particle" style="width: 6px; height: 6px; top: 20%; left: 15%; animation-delay: 0s;"></div>
    <div class="particle" style="width: 8px; height: 8px; top: 60%; left: 80%; animation-delay: 1s;"></div>
    <div class="particle" style="width: 5px; height: 5px; top: 75%; left: 25%; animation-delay: 2s;"></div>
    <div class="particle" style="width: 7px; height: 7px; top: 30%; left: 70%; animation-delay: 1.5s;"></div>
    <div class="particle" style="width: 9px; height: 9px; top: 85%; left: 60%; animation-delay: 2.5s;"></div>
  </div>

  <!-- Contenido Principal -->
  <div class="card">
    <div class="sunflower">🌻</div>
    <h1>Para Ti ✨</h1>
    <p>te amo mi princesa espero que te guste</p>
    <div class="sparkles">💖✨💖</div>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro del Universo 🌻✨</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      overflow: hidden;
      background: radial-gradient(circle at center, #1a0b2e 0%, #05020a 60%, #000000 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <script>
    let scene, camera, renderer, starLayers = [], flowerMesh;

    // Enlace de la imagen del ramo de rosas amarillas
    const URL_IMAGEN_FLOR = 'https://w7.pngwing.com/pngs/173/146/png-transparent-flower-bouquet-yellow-rose-bouquet-yellow-rose-bouquet-flower-arranging-artificial-flower-color.png'; 

    function init() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      
      // Perspectiva amplia para acentuar el efecto 3D
      camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 7;

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      // --- CAMPO DE ESTRELLAS EN 3D (3 capas de profundidad) ---
      const layerConfigs = [
        { count: 2500, size: 0.04, color: 0xffffff, radius: 40 }, // Estrellas lejanas
        { count: 1200, size: 0.08, color: 0xffe600, radius: 25 }, // Estrellas medias (doradas)
        { count: 600,  size: 0.12, color: 0xff88ff, radius: 15 }  # Estrellas cercanas (brillo galáctico)
      ];

      layerConfigs.forEach(config => {
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(config.count * 3);

        for (let i = 0; i < config.count * 3; i += 3) {
          positions[i] = (Math.random() - 0.5) * config.radius;
          positions[i + 1] = (Math.random() - 0.5) * config.radius;
          positions[i + 2] = (Math.random() - 0.5) * config.radius;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const material = new THREE.PointsMaterial({
          size: config.size,
          color: config.color,
          transparent: true,
          opacity: 0.85
        });

        const starPoints = new THREE.Points(geometry, material);
        scene.add(starPoints);
        starLayers.push({ points: starPoints, speed: (Math.random() * 0.0005) + 0.0003 });
      });

      // --- CARGAR RAMO DE ROSAS AMARILLAS EN 3D ---
      const textureLoader = new THREE.TextureLoader();
      textureLoader.crossOrigin = 'anonymous'; // Asegurar carga sin bloqueos CORS
      
      textureLoader.load(URL_IMAGEN_FLOR, function(texture) {
        const planeGeo = new THREE.PlaneGeometry(4.2, 4.2);
        const planeMat = new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true,
          side: THREE.DoubleSide
        });
        flowerMesh = new THREE.Mesh(planeGeo, planeMat);
        scene.add(flowerMesh);
      });

      window.addEventListener('resize', onWindowResize);

      animate();
    }

    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();

      // Flotación suave y bamboleo en 3D
      if (flowerMesh) {
        flowerMesh.position.y = Math.sin(elapsedTime * 1.1) * 0.22;
        flowerMesh.position.x = Math.cos(elapsedTime * 0.7) * 0.1;
        flowerMesh.rotation.y = Math.sin(elapsedTime * 0.5) * 0.18;
        flowerMesh.rotation.z = Math.cos(elapsedTime * 0.4) * 0.06;
      }

      // Rotación individual de las capas de estrellas para lograr el efecto "centro del universo"
      starLayers.forEach((layer, index) => {
        layer.points.rotation.y += layer.speed;
        layer.points.rotation.x += layer.speed * 0.5;
      });

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    init();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores Amarillas para Ti 🌻✨</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #050505;
      font-family: 'Arial', sans-serif;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    .card-modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.95);
      padding: 25px 30px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(255, 215, 0, 0.4);
      text-align: center;
      max-width: 80%;
      display: none;
      z-index: 10;
      animation: fadeIn 0.5s ease;
    }
    .card-modal h2 {
      color: #d4af37;
      margin-top: 0;
    }
    .card-modal p {
      color: #333;
      font-size: 1.1rem;
      line-height: 1.5;
    }
    .close-btn {
      background: #ffd700;
      border: none;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: bold;
      color: #333;
      cursor: pointer;
      margin-top: 15px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, -45%); }
      to { opacity: 1; transform: translate(-50%, -50%); }
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="card" class="card-modal">
    <h2>Para el amor de mi vida ❤️🌻</h2>
    <p>Estas flores amarillas representan lo brillante y especial que eres para mí.<br>¡Te amo muchísimo!</p>
    <button class="close-btn" onclick="closeCard()">Cerrar</button>
  </div>

  <script>
    let scene, camera, renderer, particles, heartMesh;

    function init() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 15;

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      const particleCount = 1500;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);
      const colors = new Float32Array(particleCount * 3);

      const color1 = new THREE.Color(0xffd700);
      const color2 = new THREE.Color(0xffffff);

      for (let i = 0; i < particleCount * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 35;
        positions[i + 1] = (Math.random() - 0.5) * 35;
        positions[i + 2] = (Math.random() - 0.5) * 35;

        const mixedColor = Math.random() > 0.3 ? color1 : color2;
        colors[i] = mixedColor.r;
        colors[i + 1] = mixedColor.g;
        colors[i + 2] = mixedColor.b;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: 0.12,
        vertexColors: true,
        transparent: true,
        opacity: 0.8
      });

      particles = new THREE.Points(geometry, material);
      scene.add(particles);

      const heartShape = new THREE.Shape();
      heartShape.moveTo(0, 0);
      heartShape.bezierCurveTo(0, 0.5, -0.5, 1, -1, 1);
      heartShape.bezierCurveTo(-1.7, 1, -1.7, 0, -1.7, 0);
      heartShape.bezierCurveTo(-1.7, -0.7, -0.7, -1.4, 0, -2);
      heartShape.bezierCurveTo(0.7, -1.4, 1.7, -0.7, 1.7, 0);
      heartShape.bezierCurveTo(1.7, 0, 1.7, 1, 1, 1);
      heartShape.bezierCurveTo(0.5, 1, 0, 0.5, 0, 0);

      const extrudeSettings = { depth: 0.4, bevelEnabled: true, bevelSegments: 3, steps: 2, bevelSize: 0.1, bevelThickness: 0.1 };
      const heartGeo = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
      const heartMat = new THREE.MeshBasicMaterial({ color: 0xffd700, wireframe: true });
      heartMesh = new THREE.Mesh(heartGeo, heartMat);
      heartMesh.scale.set(1.5, 1.5, 1.5);
      heartMesh.position.y = 1;
      scene.add(heartMesh);

      window.addEventListener('resize', onWindowResize);
      window.addEventListener('click', showCard);
      window.addEventListener('touchstart', showCard);

      animate();
    }

    function animate() {
      requestAnimationFrame(animate);

      particles.rotation.y += 0.0015;
      particles.rotation.x += 0.0005;

      if (heartMesh) {
        heartMesh.rotation.y += 0.01;
      }

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function showCard() {
      document.getElementById('card').style.display = 'block';
    }

    function closeCard() {
      event.stopPropagation();
      document.getElementById('card').style.display = 'none';
    }

    init();
  </script>
</body>
  </html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flor Amarilla 3D 🌻</title>
    <style>
        /* Configuración del fondo y contenedor principal */
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(to bottom, #1a1a2e, #16213e);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1000px;
            font-family: 'Arial', sans-serif;
        }

        h1 {
            position: absolute;
            top: 40px;
            color: #ffde43;
            text-shadow: 0 0 10px rgba(255, 222, 67, 0.5);
            font-size: 2rem;
            pointer-events: none;
        }

        /* Espacio tridimensional */
        .escena_3d {
            width: 400px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
        }

        /* Contenedor de la flor que rota continuamente */
        .flor {
            position: relative;
            width: 0;
            height: 0;
            transform-style: preserve-3d;
            animation: rotarFlor 12s linear infinite;
        }

        @keyframes rotarFlor {
            0% { transform: rotateY(0deg) rotateX(-15deg); }
            100% { transform: rotateY(360deg) rotateX(-15deg); }
        }

        /* Centro de la flor (Pistilo) */
        .centro {
            position: absolute;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #5c3a21, #362213);
            border-radius: 50%;
            transform: translate(-50%, -50%) translateZ(10px);
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        /* Base geométrica de los pétalos */
        .petalo {
            position: absolute;
            width: 25px;
            height: 110px;
            background: linear-gradient(to top, #ffcc00, #fffe7a);
            border-radius: 50% 50% 20% 20%;
            transform-origin: bottom center;
            bottom: 0;
            left: -12.5px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.15);
        }

        /* Tallo de la flor */
        .tallo {
            position: absolute;
            width: 10px;
            height: 250px;
            background: linear-gradient(to right, #2d6a4f, #1b4332);
            top: 0;
            left: -5px;
            transform: rotateX(90deg) translateZ(-125px);
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h1>Para Ti 🌻</h1>

    <div class="escena_3d">
        <div class="flor" id="contenedor-flor">
            <!-- El tallo y centro fijos -->
            <div class="tallo"></div>
            <div class="centro"></div>
        </div>
    </div>

    <script>
        const flor = document.getElementById('contenedor-flor');
        const totalPetalos = 18; // Cantidad de pétalos alrededor de la flor

        for (let i = 0; i < totalPetalos; i++) {
            const petalo = document.createElement('div');
            petalo.classList.add('petalo');
            
            // Calculamos el ángulo en el espacio para cada pétalo
            const anguloZ = (360 / totalPetalos) * i;
            
            // Inclinamos ligeramente hacia el frente (X) para darle profundidad de copa 3D
            const inclinacionX = 20; 

            petalo.style.transform = `rotateZ(${anguloZ}deg) rotateX(${inclinacionX}deg)`;
            
            flor.appendChild(petalo);
        }
    </script>
</body>
</html>

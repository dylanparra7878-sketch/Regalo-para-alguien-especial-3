<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores Amarillas para Ti 🌻✨</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #050505;
      font-family: 'Arial', sans-serif;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    .card-modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.95);
      padding: 25px 30px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(255, 215, 0, 0.5);
      text-align: center;
      max-width: 80%;
      display: none;
      z-index: 10;
      animation: fadeIn 0.5s ease;
    }
    .card-modal h2 {
      color: #d4af37;
      margin-top: 0;
      font-size: 1.5rem;
    }
    .card-modal p {
      color: #333;
      font-size: 1.1rem;
      line-height: 1.6;
      font-weight: 500;
    }
    .close-btn {
      background: #ffd700;
      border: none;
      padding: 10px 22px;
      border-radius: 20px;
      font-weight: bold;
      color: #333;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, -45%); }
      to { opacity: 1; transform: translate(-50%, -50%); }
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="card" class="card-modal">
    <h2>Un detalle para ti 🌻✨</h2>
    <p>espero q te guste mi amor quiero que recuerdes q te amo muchísimo y siempre quiero estar a tu lado;3</p>
    <button class="close-btn" onclick="closeCard(event)">Cerrar</button>
  </div>

  <script>
    let scene, camera, renderer, particles, bouquetGroup;

    function createFlower() {
      const flower = new THREE.Group();

      // Centro de la flor
      const centerGeo = new THREE.SphereGeometry(0.3, 16, 16);
      const centerMat = new THREE.MeshBasicMaterial({ color: 0x8b5a2b });
      const center = new THREE.Mesh(centerGeo, centerMat);
      flower.add(center);

      // Pétalos amarillos
      const petalCount = 8;
      const petalGeo = new THREE.ConeGeometry(0.2, 0.9, 12);
      const petalMat = new THREE.MeshBasicMaterial({ color: 0xffd700, wireframe: false });

      for (let i = 0; i < petalCount; i++) {
        const angle = (i / petalCount) * Math.PI * 2;
        const petal = new THREE.Mesh(petalGeo, petalMat);
        petal.position.x = Math.cos(angle) * 0.45;
        petal.position.y = Math.sin(angle) * 0.45;
        petal.rotation.z = angle - Math.PI / 2;
        flower.add(petal);
      }

      // Tallo verde
      const stemGeo = new THREE.CylinderGeometry(0.04, 0.04, 2.5, 8);
      const stemMat = new THREE.MeshBasicMaterial({ color: 0x2e8b57 });
      const stem = new THREE.Mesh(stemGeo, stemMat);
      stem.position.y = -1.25;
      flower.add(stem);

      return flower;
    }

    function init() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 15;

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      // Partículas de la galaxia
      const particleCount = 1800;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);
      const colors = new Float32Array(particleCount * 3);

      const color1 = new THREE.Color(0xffd700);
      const color2 = new THREE.Color(0xffffff);

      for (let i = 0; i < particleCount * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 35;
        positions[i + 1] = (Math.random() - 0.5) * 35;
        positions[i + 2] = (Math.random() - 0.5) * 35;

        const mixedColor = Math.random() > 0.3 ? color1 : color2;
        colors[i] = mixedColor.r;
        colors[i + 1] = mixedColor.g;
        colors[i + 2] = mixedColor.b;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: 0.12,
        vertexColors: true,
        transparent: true,
        opacity: 0.8
      });

      particles = new THREE.Points(geometry, material);
      scene.add(particles);

      // Crear Ramo de Flores
      bouquetGroup = new THREE.Group();
      const flowerCount = 12;

      for (let i = 0; i < flowerCount; i++) {
        const fl = createFlower();
        const angle = (i / flowerCount) * Math.PI * 2;
        fl.position.x = Math.cos(angle) * 1.2;
        fl.position.z = Math.sin(angle) * 1.2;
        fl.position.y = (Math.random() - 0.5) * 0.8;
        fl.rotation.z = (Math.random() - 0.5) * 0.4;
        bouquetGroup.add(fl);
      }

      // Flor central más alta
      const centerFl = createFlower();
      centerFl.position.set(0, 0.5, 0);
      centerFl.scale.set(1.2, 1.2, 1.2);
      bouquetGroup.add(centerFl);

      bouquetGroup.position.y = 0.5;
      scene.add(bouquetGroup);

      window.addEventListener('resize', onWindowResize);
      window.addEventListener('click', showCard);
      window.addEventListener('touchstart', showCard);

      animate();
    }

    function animate() {
      requestAnimationFrame(animate);

      particles.rotation.y += 0.0015;
      particles.rotation.x += 0.0005;

      if (bouquetGroup) {
        bouquetGroup.rotation.y += 0.01;
      }

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function showCard() {
      document.getElementById('card').style.display = 'block';
    }

    function closeCard(event) {
      event.stopPropagation();
      document.getElementById('card').style.display = 'none';
    }

    init();
  </script>
</body>
</html>
